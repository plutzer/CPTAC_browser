version: '3.8'

services:
  cptac-browser:
    build: .
    image: cptac-browser:latest
    container_name: cptac-browser
    ports:
      - "8000:8000"
    volumes:
      # Persist CPTAC data cache between restarts
      - cptac-data:/root/.cptac
    environment:
      - PYTHONUNBUFFERED=1
      - SHINY_HOST=0.0.0.0
      - SHINY_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  cptac-data:
    driver: local
